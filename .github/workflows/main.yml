name: Build Mulervet APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # IMPORTANT: You need to have a framework like Capacitor or Cordova 
      # in your project for this to build an APK. 
      # If you just have the HTML file, this step will fail.
      # This assumes you are using Capacitor (common for HTML to APK).
      
      - name: Install dependencies
        run: |
          npm install
          npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mulervet-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
